- name: Create directory for HH-suite databases
  become: true
  ansible.builtin.file: 
    path: /home/almalinux/data/pdb70
    state: directory
    owner: almalinux
    group: almalinux
    mode: "0755"




- name: Download pdb70 database
  become: true
  ansible.builtin.get_url:
    url: https://wwwuser.gwdg.de/~compbiol/data/hhsuite/databases/hhsuite_dbs/pdb70_from_mmcif_latest.tar.gz
    dest: /home/almalinux/data/pdb70/pdb70_from_mmcif_latest.tar.gz


