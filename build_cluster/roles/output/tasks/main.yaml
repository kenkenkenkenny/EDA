- name: Copy output.py
  become: true
  become_user: root
  ansible.builtin.copy:
    src: output.py
    dest: /home/almalinux/scripts/output.py

- name: Run output aggregation script
  become: true
  become_user: almalinux
  ansible.builtin.command:
    cmd: python3.12 /home/almalinux/scripts/output.py
    chdir: /home/almalinux/scripts 